<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>استوديو السينما ٣D — اصنع فيلمك القصير</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d0f1a; --panel:#161a2e; --panel2:#1e2340; --accent:#f5b942; --accent2:#4ecdc4;
  --text:#f2f2f7; --muted:#9aa0c0; --danger:#ff5d6c; --ok:#52d273; --radius:14px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:'Cairo',sans-serif;}
#app{display:flex;flex-direction:column;height:100%;}
/* ===== top bar ===== */
#topbar{display:flex;align-items:center;gap:8px;padding:8px 12px;background:linear-gradient(180deg,#1a1f3a,#141830);border-bottom:1px solid #262c52;z-index:30;flex-wrap:wrap;}
#topbar .logo{font-weight:900;font-size:18px;color:var(--accent);white-space:nowrap;display:flex;align-items:center;gap:6px;}
#topbar .logo small{color:var(--muted);font-weight:600;font-size:11px;}
.tb-btn{background:var(--panel2);color:var(--text);border:1px solid #2c3360;border-radius:10px;padding:7px 12px;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:6px;transition:.15s;}
.tb-btn:hover{background:#282f56;transform:translateY(-1px);}
.tb-btn.primary{background:linear-gradient(135deg,#f5b942,#e8862e);color:#221a05;border:none;}
.tb-btn.danger{color:var(--danger);}
.tb-btn:disabled{opacity:.45;cursor:not-allowed;transform:none;}
/* ===== main ===== */
#main{flex:1;display:flex;min-height:0;position:relative;}
#viewport{flex:1;position:relative;min-width:0;}
#c3d{width:100%;height:100%;display:block;touch-action:none;}
#letterbox{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .4s;}
#letterbox.on{opacity:1;}
#letterbox .bar{position:absolute;left:0;right:0;height:9%;background:#000;}
#letterbox .bar.top{top:0;} .letterbox .bar.bottom{bottom:0;}
#letterbox .bar{bottom:0;}
#letterbox .bar.b{bottom:0;top:auto;}
#rec-badge{position:absolute;top:12px;left:12px;background:#0009;color:#fff;padding:5px 12px;border-radius:20px;font-size:12px;font-weight:700;display:none;align-items:center;gap:7px;z-index:20;}
#rec-badge.on{display:flex;}
#rec-badge .dot{width:10px;height:10px;border-radius:50%;background:var(--danger);animation:blink 1s infinite;}
@keyframes blink{50%{opacity:.2;}}
#film-clock{position:absolute;top:12px;right:12px;background:#0009;color:#fff;padding:5px 12px;border-radius:20px;font-size:12px;font-weight:700;z-index:20;font-variant-numeric:tabular-nums;}
#viewport-hint{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);background:#000a;color:#ccd;border-radius:20px;padding:4px 14px;font-size:11px;pointer-events:none;transition:opacity 1s;z-index:15;white-space:nowrap;}
/* ===== side panel ===== */
#panel{width:320px;background:var(--panel);border-inline-start:1px solid #262c52;display:flex;flex-direction:column;z-index:25;transition:margin .25s;}
#panel.hidden{margin-inline-end:-320px;}
#panel-tabs{display:flex;background:var(--panel2);}
#panel-tabs button{flex:1;padding:10px 4px;background:none;border:none;color:var(--muted);font-family:inherit;font-weight:700;font-size:12.5px;cursor:pointer;border-bottom:2px solid transparent;}
#panel-tabs button.active{color:var(--accent);border-bottom-color:var(--accent);}
#panel-body{flex:1;overflow-y:auto;padding:10px;}
#panel-toggle{position:absolute;top:50%;inset-inline-start:0;transform:translateY(-50%);z-index:26;background:var(--panel2);border:1px solid #2c3360;border-inline-end:none;color:var(--accent);border-radius:10px 0 0 10px;padding:14px 6px;cursor:pointer;font-size:14px;}
#panel.hidden + #panel-toggle{border-radius:0 10px 10px 0;}
.sec{background:var(--panel2);border-radius:var(--radius);padding:10px;margin-bottom:10px;}
.sec h4{margin:0 0 8px;font-size:13px;color:var(--accent);display:flex;justify-content:space-between;align-items:center;}
.sec h4 .mini{font-size:11px;color:var(--muted);cursor:pointer;text-decoration:underline;}
.row{display:flex;gap:6px;align-items:center;margin-bottom:7px;flex-wrap:wrap;}
.row label{font-size:12px;color:var(--muted);min-width:64px;}
.row input[type=number],.row input[type=text],.row select{flex:1;background:#0f1226;border:1px solid #2c3360;color:var(--text);border-radius:8px;padding:6px 8px;font-family:inherit;font-size:13px;min-width:0;}
.row input[type=range]{flex:1;accent-color:var(--accent);}
.row input[type=color]{width:38px;height:30px;border:none;background:none;padding:0;cursor:pointer;border-radius:6px;}
.chip-btn{background:#262c52;border:1px solid #333a6b;color:var(--text);border-radius:9px;padding:6px 10px;font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;}
.chip-btn:hover{background:#303a70;}
.chip-btn.sel{background:var(--accent);color:#221a05;border-color:var(--accent);}
.chip-btn.warn{color:var(--danger);}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
.obj-list{max-height:170px;overflow-y:auto;display:flex;flex-direction:column;gap:4px;}
.obj-item{display:flex;align-items:center;gap:8px;background:#12152b;border:1px solid #262c52;border-radius:9px;padding:6px 9px;cursor:pointer;font-size:12.5px;}
.obj-item.sel{border-color:var(--accent);background:#1d2140;}
.obj-item .sw{width:14px;height:14px;border-radius:4px;flex-shrink:0;}
.obj-item .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.obj-item .x{color:var(--danger);cursor:pointer;font-weight:900;padding:0 4px;}
/* ===== timeline ===== */
#timeline-wrap{background:#11142a;border-top:1px solid #262c52;padding:6px 10px 10px;z-index:24;}
#tl-head{display:flex;align-items:center;gap:8px;margin-bottom:5px;flex-wrap:wrap;}
#tl-head .time{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:86px;text-align:center;}
#tl-play{width:40px;height:32px;border-radius:9px;border:none;background:linear-gradient(135deg,#4ecdc4,#2ea89f);color:#04211f;font-size:15px;cursor:pointer;font-weight:900;}
#tl-stop,#tl-slow{width:36px;height:32px;border-radius:9px;border:1px solid #2c3360;background:var(--panel2);color:var(--text);cursor:pointer;font-size:13px;}
#tl-slow.sel{background:var(--accent);color:#221a05;border-color:var(--accent);}
#tl-canvas-holder{position:relative;height:96px;background:#0b0d1d;border-radius:10px;overflow:hidden;}
#tl-canvas{width:100%;height:100%;display:block;cursor:crosshair;}
/* ===== overlays ===== */
#overlay{position:fixed;inset:0;background:#05060ecc;display:none;align-items:center;justify-content:center;z-index:100;flex-direction:column;gap:14px;text-align:center;padding:20px;}
#overlay.on{display:flex;}
#overlay .box{background:var(--panel);border:1px solid #2c3360;border-radius:18px;padding:26px 30px;max-width:420px;width:100%;}
#overlay h2{color:var(--accent);margin:0 0 8px;font-size:20px;}
#overlay p{color:var(--muted);font-size:13.5px;line-height:1.7;margin:0 0 16px;}
#overlay .row{justify-content:center;}
.spinner{width:44px;height:44px;border:4px solid #2c3360;border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 12px;}
@keyframes spin{to{transform:rotate(360deg);}}
#toast{position:fixed;bottom:130px;left:50%;transform:translateX(-50%) translateY(20px);background:#1e2340f0;border:1px solid var(--accent);color:var(--text);padding:9px 20px;border-radius:24px;font-size:13px;font-weight:700;opacity:0;transition:.3s;z-index:120;pointer-events:none;max-width:88vw;text-align:center;}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0);}
/* ===== responsive ===== */
@media (max-width:760px){
  #panel{position:absolute;top:0;bottom:0;inset-inline-end:0;width:min(84vw,330px);box-shadow:-6px 0 24px #0008;}
  #topbar{flex-wrap:nowrap;overflow-x:auto;padding:6px 8px;gap:6px;scrollbar-width:thin;}
  #topbar .logo{font-size:14px;flex:none;}
  #topbar .logo small{display:none;}
  .tb-btn{padding:6px 9px;font-size:12px;flex:none;white-space:nowrap;}
  #tl-canvas-holder{height:78px;}
}
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <div class="logo">🎬 استوديو السينما <small>اصنع فيلمك ٣D</small></div>
    <button class="tb-btn primary" id="btn-demo">✨ مشهد جاهز</button>
    <button class="tb-btn" id="btn-export">⬇️ تصدير الفيلم</button>
    <button class="tb-btn" id="btn-poster">📸 بوستر</button>
    <button class="tb-btn" id="btn-share">🔗 مشاركة</button>
    <button class="tb-btn" id="btn-save">💾 حفظ</button>
    <button class="tb-btn" id="btn-loadjson">📂 استيراد</button>
    <button class="tb-btn" id="btn-savejson">📤 نسخة JSON</button>
    <button class="tb-btn" id="btn-undo">↩️ تراجع</button>
    <button class="tb-btn" id="btn-redo">↪️ إعادة</button>
    <button class="tb-btn danger" id="btn-clear">🗑️ جديد</button>
    <span id="save-ind" style="font-size:11px;color:#8a90b8;font-weight:700;flex:none"></span>
  </div>
  <div id="main">
    <div id="viewport">
      <canvas id="c3d"></canvas>
      <div id="letterbox"><div class="bar top"></div><div class="bar b"></div></div>
      <div id="rec-badge"><span class="dot"></span> تسجيل</div>
      <div id="film-clock">00:00 / 00:00</div>
      <div id="viewport-hint">اسحب للف الكاميرا • عجلة الفأرة للتقريب • اضغط على عنصر لتحديده</div>
    </div>
    <div id="panel">
      <div id="panel-tabs">
        <button data-tab="scene" class="active">🎬 المشهد</button>
        <button data-tab="shots">🎥 اللقطات</button>
        <button data-tab="texts">📝 النصوص</button>
        <button data-tab="sound">🎵 الصوت</button>
        <button data-tab="light">💡 الإضاءة</button>
      </div>
      <div id="panel-body"></div>
    </div>
    <button id="panel-toggle">◀</button>
  </div>
  <div id="timeline-wrap">
    <div id="tl-head">
      <button id="tl-play">▶</button>
      <button id="tl-stop">⏹</button>
      <button id="tl-slow" title="حركة بطيئة">🐢</button>
      <div class="time" id="tl-time">0.0 ث / 30 ث</div>
      <div class="row" style="flex:1;margin:0;">
        <label>مدة الفيلم</label>
        <input type="range" id="film-dur" min="5" max="120" value="30" step="1" style="max-width:140px;">
        <span id="film-dur-lbl" style="font-size:12px;color:var(--accent);font-weight:700;">30 ث</span>
      </div>
      <button class="chip-btn" id="tl-addmark">＋ حدث صوتي هنا</button>
    </div>
    <div id="tl-canvas-holder"><canvas id="tl-canvas"></canvas></div>
  </div>
</div>

<div id="overlay"><div class="box" id="overlay-box"></div></div>
<div id="toast"></div>
<input type="file" id="json-file" accept=".json" style="display:none">

<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}
</script>
<script type="module" src="app.js?v=25"></script>
</body>
</html>
